name: Build Spending Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Bundle web files into Capacitor wrapper
        run: |
          set -e
          mkdir -p apk-build/www
          for f in index.html app.js style.css style.js manifest.json logo.svg *.png; do
            [ -e "$f" ] && cp "$f" apk-build/www/
          done
          cd apk-build
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Spending Tracker" "com.jamshi122.spendingtracker" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jamshi122.spendingtracker",
            "appName": "Spending Tracker",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          set -e
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug
          BUILT_APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            echo "ERROR: No debug APK found under app/build/outputs/apk/debug"
            find app/build -maxdepth 5 || true
            exit 1
          fi
          cp "$BUILT_APK" "$GITHUB_WORKSPACE/SpendingTracker-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/SpendingTracker-debug.apk"

      - name: Publish direct APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK_FILE="$GITHUB_WORKSPACE/SpendingTracker-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Missing $APK_FILE"
            exit 1
          fi
          ls -lh "$APK_FILE"
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "$APK_FILE" --clobber
            gh release edit latest-apk --title "Spending Tracker Latest APK" --latest
          else
            gh release create latest-apk "$APK_FILE" --title "Spending Tracker Latest APK" --notes "Latest debug APK build for Spending Tracker" --latest
          fi
