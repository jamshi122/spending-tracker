name: Build Spending Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Bundle web files into Capacitor wrapper
        run: |
          set -e
          mkdir -p apk-build/www
          for f in index.html app.js style.css style.js manifest.json logo.svg *.png; do
            [ -e "$f" ] && cp "$f" apk-build/www/
          done
          cd apk-build
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Spending Tracker" "com.jamshi122.spendingtracker" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jamshi122.spendingtracker",
            "appName": "Spending Tracker",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          set -e
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" ../../SpendingTracker-debug.apk
          ls -lh ../../SpendingTracker-debug.apk

      - name: Publish direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Spending Tracker Latest APK
          files: apk-build/SpendingTracker-debug.apk
          make_latest: true
