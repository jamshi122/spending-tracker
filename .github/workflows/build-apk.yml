name: Build Spending Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Create Capacitor wrapper
        run: |
          set -e
          mkdir -p apk-build/www
          echo "Loading Spending Tracker..." > apk-build/www/index.html
          cd apk-build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Spending Tracker" "com.jamshi122.spendingtracker" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jamshi122.spendingtracker",
            "appName": "Spending Tracker",
            "webDir": "www",
            "server": {
              "url": "https://jamshi122.github.io/mypersonal/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          set -e
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spending-tracker-debug-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
